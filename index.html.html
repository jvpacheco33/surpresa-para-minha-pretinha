<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para a Minha Esposa ❤️</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f43f5e, #881337);
            color: #ffffff;
            text-align: center;
            padding: 30px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .container {
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            max-width: 450px;
            width: 100%;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        h1 {
            font-size: 26px;
            margin-bottom: 10px;
        }
        p {
            color: #f1f5f9;
            font-size: 16px;
            margin-bottom: 25px;
        }
        .botoes-grupo {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        button {
            background-color: #ffffff;
            color: #881337;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        button:hover {
            background-color: #ffe4e6;
            transform: translateY(-2px);
        }
        #mensagem-surpresa {
            margin-top: 25px;
            font-size: 18px;
            font-weight: bold;
            color: #fef08a;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Surpresa Especial ❤️</h1>
        <p>Escolhe um dos botões abaixo para revelar o teu prêmio de hoje:</p>
        
        <div class="botoes-grupo">
            <button onclick="mostrarPremio(1)">🎁 Ver Vale Surpresa 1</button>
            <button onclick="mostrarPremio(2)">🍫 Ver Vale Surpresa 2</button>
            <button onclick="mostrarPremio(3)">✨ Mensagem Especial</button>
        </div>

        <div id="mensagem-surpresa">Clica numa das opções acima! 👇</div>
    </div>

    <script>
        function mostrarPremio(opcao) {
            let caixaMensagem = document.getElementById("mensagem-surpresa");
            
            if (opcao === 1) {
                caixaMensagem.innerHTML = "🎉 Vale um jantar ou lanche preferido escolhido por ti!";
            } else if (opcao === 2) {
                caixaMensagem.innerHTML = "🎬 Vale uma sessão de cinema em casa com direito a umas chupadas na quarta feira!";
            } else if (opcao === 3) {
                caixaMensagem.innerHTML = "❤️ Obrigado por ser a melhor parceira e companheira de todas as horas te amo preta!";
            }
        }
    </script>

</body>
</html>
